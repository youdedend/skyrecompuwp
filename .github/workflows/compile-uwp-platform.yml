name: Compile UWP platform layer

# Compiles runtime/platform/uwp.c with clang-cl against the real Windows SDK in the UWP
# configuration (WINAPI_FAMILY_APP, _CRT_APP, SKYRECOMP_UWP). No linking, no packaging, no game
# files: /fsyntax-only means this answers one question cheaply - does the platform layer compile
# in the configuration it will ship in.
#
# Before this exists, uwp.c had never been compiled anywhere. Every error it produces is a real
# port defect, and the annotations below are the only way those errors are readable from CI.

on:
  push:
    paths:
      - 'xbox-uwp/port/**'
      - '.github/workflows/compile-uwp-platform.yml'
  pull_request:
    paths:
      - 'xbox-uwp/port/**'
      - '.github/workflows/compile-uwp-platform.yml'
  workflow_dispatch:

concurrency:
  group: compile-uwp-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UPSTREAM_REPO: https://github.com/Apolinario-coder/SkyRecomp
  UPSTREAM_SHA: f005a619b1732376ac355243cc5b30e2ccc89ca9

jobs:
  syntax:
    name: clang-cl /fsyntax-only (UWP x64)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out the port
        uses: actions/checkout@v4
        with:
          path: port

      - name: Fetch upstream at the pinned commit
        shell: bash
        run: |
          set -euo pipefail
          git init -q upstream
          git -C upstream remote add origin "$UPSTREAM_REPO"
          git -C upstream fetch -q --depth 1 origin "$UPSTREAM_SHA"
          git -C upstream checkout -q FETCH_HEAD
          echo "upstream at $(git -C upstream rev-parse HEAD)"

      - name: Apply the port's patches
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          for p in ../port/xbox-uwp/port/patches/*.patch; do
            echo "applying $(basename "$p")"
            git apply --verbose "$p"
          done

      - name: Install the platform layer
        shell: bash
        run: |
          set -euo pipefail
          cp port/xbox-uwp/port/runtime/platform/uwp.c        upstream/runtime/platform/uwp.c
          cp port/xbox-uwp/port/runtime/platform/uwp_compat.h upstream/runtime/platform/uwp_compat.h
          ls -l upstream/runtime/platform/

      - name: Set up the MSVC/UWP environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Syntax check uwp.c
        id: check
        shell: bash
        run: |
          set -uo pipefail
          # /fsyntax-only: parse and type-check in UWP configuration, produce no object.
          # The defines are the same set CMakeLists.txt uses for the real build, so this checks
          # the configuration that matters rather than a desktop approximation of it.
          clang-cl /nologo /fsyntax-only /W3 \
            /DWINAPI_FAMILY=WINAPI_FAMILY_APP \
            /D_CRT_APP \
            /DSKYRECOMP_UWP=1 \
            /D_WIN32_WINNT=0x0A00 \
            /DNOMINMAX \
            /DWIN32_LEAN_AND_MEAN \
            /D_AMD64_ /D_WIN64 \
            /I upstream/runtime \
            upstream/runtime/platform/uwp.c 2>&1 | tee diag.txt
          status=${PIPESTATUS[0]}
          echo "clang-cl exit: $status"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Report diagnostics as annotations
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          # Job logs are not readable from where this project is developed; annotations are.
          # C:\...\file(12,5): error: text  ->  ::error file=file,line=12,col=5::text
          python - <<'PY'
          import os, re, sys
          if not os.path.exists("diag.txt"):
              print("::warning::no compiler output captured")
              sys.exit(0)
          text = open("diag.txt", encoding="utf-8", errors="replace").read()
          # Strip the runner's absolute prefix so the annotation points into the repo.
          root = os.path.abspath("upstream")
          pattern = re.compile(r"^(.*?)\((\d+),(\d+)\):\s*(error|warning|note):\s*(.*)$", re.M)
          n_err = n_warn = 0
          for m in pattern.finditer(text):
              path, line, col, sev, msg = m.groups()
              path = os.path.abspath(path).replace(os.sep, "/")
              root_slash = root.replace(os.sep, "/")
              path = path[len(root_slash) + 1:] if path.startswith(root_slash + "/") else path
              msg = msg.replace("%", "%25").replace("\r", "").replace("\n", " ")
              if sev == "error":
                  n_err += 1
                  print(f"::error file=upstream/{path},line={line},col={col}::{msg}")
              elif sev == "warning":
                  n_warn += 1
                  print(f"::warning file=upstream/{path},line={line},col={col}::{msg}")
          print(f"parsed: {n_err} errors, {n_warn} warnings")
          if "no matching" in text or "command not found" in text:
              print("::error::clang-cl not available in the environment")
          PY

      - name: Fail if the compiler rejected the platform layer
        shell: bash
        run: |
          if [ "${{ steps.check.outputs.status }}" != "0" ]; then
            echo "::error::uwp.c does not compile in the UWP configuration (see annotations)"
            exit 1
          fi
          echo "uwp.c compiles clean in the UWP configuration"

      - name: Upload the raw diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uwp-compile-diagnostics
          path: diag.txt
          if-no-files-found: ignore
          retention-days: 14
