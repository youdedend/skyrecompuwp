name: Compile UWP platform layer

# Compiles runtime/platform/uwp.c with clang-cl against the real Windows SDK in the UWP
# configuration (WINAPI_FAMILY_APP, _CRT_APP, SKYRECOMP_UWP). No linking, no packaging, no game
# files: /fsyntax-only means this answers one question cheaply - does the platform layer compile
# in the configuration it will ship in.
#
# Before this exists, uwp.c had never been compiled anywhere. Every error it produces is a real
# port defect, and the annotations below are the only way those errors are readable from CI.

on:
  push:
    paths:
      - 'xbox-uwp/port/**'
      - '.github/workflows/compile-uwp-platform.yml'
  pull_request:
    paths:
      - 'xbox-uwp/port/**'
      - '.github/workflows/compile-uwp-platform.yml'
  workflow_dispatch:

concurrency:
  group: compile-uwp-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UPSTREAM_REPO: https://github.com/Apolinario-coder/SkyRecomp
  UPSTREAM_SHA: f005a619b1732376ac355243cc5b30e2ccc89ca9

jobs:
  syntax:
    name: clang-cl /fsyntax-only (UWP x64)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out the port
        uses: actions/checkout@v4
        with:
          path: port

      - name: Fetch upstream at the pinned commit
        shell: bash
        run: |
          set -euo pipefail
          git init -q upstream
          git -C upstream remote add origin "$UPSTREAM_REPO"
          git -C upstream fetch -q --depth 1 origin "$UPSTREAM_SHA"
          git -C upstream checkout -q FETCH_HEAD
          echo "upstream at $(git -C upstream rev-parse HEAD)"

      - name: Apply the port's patches
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          for p in ../port/xbox-uwp/port/patches/*.patch; do
            echo "applying $(basename "$p")"
            git apply --verbose "$p"
          done

      - name: Install the platform layer
        shell: bash
        run: |
          set -euo pipefail
          cp port/xbox-uwp/port/runtime/platform/uwp.c        upstream/runtime/platform/uwp.c
          cp port/xbox-uwp/port/runtime/platform/uwp_compat.h upstream/runtime/platform/uwp_compat.h
          cp port/xbox-uwp/port/runtime/platform/uwp_entry.cpp upstream/runtime/platform/uwp_entry.cpp
          cp port/xbox-uwp/port/runtime/platform/uwp_present.h  upstream/runtime/platform/uwp_present.h
          cp port/xbox-uwp/port/runtime/platform/uwp_present.cpp upstream/runtime/platform/uwp_present.cpp
          cp port/xbox-uwp/port/runtime/platform/uwp_vk_present.h  upstream/runtime/platform/uwp_vk_present.h
          cp port/xbox-uwp/port/runtime/platform/uwp_vk_present.c  upstream/runtime/platform/uwp_vk_present.c
          ls -l upstream/runtime/platform/

      - name: Fetch Vulkan headers
        shell: bash
        run: |
          set -euo pipefail
          # Only the headers: the Vulkan-side file is checked for type correctness, not linked.
          git clone -q --depth 1 https://github.com/KhronosGroup/Vulkan-Headers vkheaders
          ls vkheaders/include/vulkan/vulkan_core.h

      - name: Set up the MSVC/UWP environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Probe the toolchain
        shell: bash
        run: |
          # Two things have bitten this step already, so both are measured rather than assumed:
          #   1. whether MSYS (Git Bash) mangles /D-style arguments into Windows paths
          #   2. whether clang-cl is on PATH at all
          echo "MSYSTEM=${MSYSTEM:-unset}  shell=$BASH_VERSION"
          echo "clang-cl: $(command -v clang-cl || echo MISSING)"
          clang-cl --version 2>&1 | head -3
          printf '#ifdef SKYRECOMP_UWP\nUWP_DEFINE_SEEN\n#else\nUWP_DEFINE_MISSING\n#endif\n' > probe.c
          echo "--- /D form ---"
          clang-cl /nologo /EP /DSKYRECOMP_UWP=1 probe.c 2>&1 | grep -E "UWP_DEFINE|error" || true
          echo "--- -D form ---"
          clang-cl -nologo -E -DSKYRECOMP_UWP=1 probe.c 2>&1 | grep -E "UWP_DEFINE|error" || true
          rm -f probe.c

      - name: Syntax check uwp.c
        id: check
        shell: bash
        env:
          MSYS_NO_PATHCONV: '1'   # stop Git Bash rewriting /flags into C:/... paths
        run: |
          # GitHub runs bash with -e -o pipefail. A failing compiler must not abort the step
          # before the diagnostics are parsed, or the only trace is "exit code 1".
          set +e
          # Dash-prefixed flags throughout: MSYS path conversion only rewrites arguments that
          # start with a slash, and a silently dropped -DSKYRECOMP_UWP selects the wrong
          # platform header - which is exactly what the first run of this job reported.
          # /fsyntax-only: parse and type-check in the UWP configuration, produce no object.
          clang-cl -nologo -fsyntax-only -W3 \
            -DWINAPI_FAMILY=WINAPI_FAMILY_APP \
            -D_CRT_APP \
            -DSKYRECOMP_UWP=1 \
            -D_WIN32_WINNT=0x0A00 \
            -D_CRT_SECURE_NO_WARNINGS \
            -DNOMINMAX \
            -DWIN32_LEAN_AND_MEAN \
            -D_AMD64_ -D_WIN64 \
            -I upstream/runtime \
            upstream/runtime/platform/uwp.c > diag.txt 2>&1
          status=$?
          echo "clang-cl (uwp.c) exit: $status"

          # The presentation bridge is plain C++ (no /ZW), so clang-cl checks it too.
          clang-cl -nologo -fsyntax-only -W3 -std=c++17 \
            -DWINAPI_FAMILY=WINAPI_FAMILY_APP \
            -D_CRT_APP \
            -DSKYRECOMP_UWP=1 \
            -D_WIN32_WINNT=0x0A00 \
            -D_CRT_SECURE_NO_WARNINGS \
            -DNOMINMAX \
            -D_AMD64_ -D_WIN64 \
            -I upstream/runtime \
            upstream/runtime/platform/uwp_present.cpp >> diag.txt 2>&1
          present=$?
          echo "clang-cl (uwp_present.cpp) exit: $present"
          [ "$present" -eq 0 ] || status=1

          # The Vulkan half needs the Khronos headers; it is checked as C, like the runtime it
          # belongs to.
          clang-cl -nologo -fsyntax-only -W3 \
            -DWINAPI_FAMILY=WINAPI_FAMILY_APP \
            -D_CRT_APP \
            -DSKYRECOMP_UWP=1 \
            -D_WIN32_WINNT=0x0A00 \
            -D_CRT_SECURE_NO_WARNINGS \
            -DNOMINMAX \
            -D_AMD64_ -D_WIN64 \
            -I upstream/runtime \
            -I vkheaders/include \
            upstream/runtime/platform/uwp_vk_present.c >> diag.txt 2>&1
          vkpresent=$?
          echo "clang-cl (uwp_vk_present.c) exit: $vkpresent"
          [ "$vkpresent" -eq 0 ] || status=1

          echo "status=$status" >> "$GITHUB_OUTPUT"
          head -60 diag.txt
          exit 0

      - name: Syntax check uwp_entry.cpp (MSVC /ZW)
        id: entry
        shell: bash
        env:
          MSYS_NO_PATHCONV: '1'
        run: |
          # C++/CX cannot be compiled by clang-cl: /ZW is MSVC only. The runtime is clang-cl and
          # the host is MSVC, which is legal because both are MSVC x64 ABI - but it does mean this
          # one file needs its own check, in its own compiler.
          set +e
          WINDOWS_WINMD=$(ls "$WindowsSdkDir"/UnionMetadata/*/Windows.winmd 2>/dev/null | head -1)
          echo "Windows.winmd: ${WINDOWS_WINMD:-not found}"
          cl /nologo /Zs /ZW /EHsc /W3 \
             /D_WIN32_WINNT=0x0A00 \
             /DWINAPI_FAMILY=WINAPI_FAMILY_APP \
             /D_CRT_APP \
             /D_CRT_SECURE_NO_WARNINGS \
             ${WINDOWS_WINMD:+/FU"$WINDOWS_WINMD"} \
             upstream/runtime/platform/uwp_entry.cpp > entry-diag.txt 2>&1
          status=$?
          echo "cl exit: $status"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          head -40 entry-diag.txt
          exit 0

      - name: Report diagnostics as annotations
        if: always()
        shell: bash
        run: |
          set +e
          PY=$(command -v python || command -v python3 || echo python)
          $PY port/xbox-uwp/port/annotate-diagnostics.py diag.txt \
              --root upstream --status "${{ steps.check.outputs.status }}"
          if [ -f entry-diag.txt ]; then
            $PY port/xbox-uwp/port/annotate-diagnostics.py entry-diag.txt \
                --root upstream --status "${{ steps.entry.outputs.status }}"
          fi
          exit 0

      - name: Fail if the compiler rejected the platform layer
        shell: bash
        run: |
          fail=0
          if [ "${{ steps.check.outputs.status }}" != "0" ]; then
            echo "::error::uwp.c does not compile in the UWP configuration (see annotations)"
            fail=1
          fi
          if [ "${{ steps.entry.outputs.status }}" != "0" ]; then
            echo "::error::uwp_entry.cpp does not compile with /ZW (see annotations)"
            fail=1
          fi
          [ "$fail" = "0" ] || exit 1
          echo "uwp.c and uwp_entry.cpp both compile in the UWP configuration"

      - name: Upload the raw diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uwp-compile-diagnostics
          path: |
            diag.txt
            entry-diag.txt
          if-no-files-found: ignore
          retention-days: 14
